name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format (verify)
        run: uv run ruff format --check .
      - name: mypy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: uv run mypy .

  test:
    name: pytest (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: deeplrn_test
          POSTGRES_USER: deeplrn
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deeplrn"
          --health-interval 5s
          --health-retries 10
    env:
      DEEPLRN_DATABASE_URL: postgres://deeplrn:ci-password@localhost:5432/deeplrn_test
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Run migrations check
        run: uv run python manage.py makemigrations --check --no-input
      - name: Tests with coverage
        run: |
          uv run pytest -q --cov --cov-report=term-missing

  smoke:
    name: Django system checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: manage.py check
        run: uv run python manage.py check
      - name: collectstatic
        run: uv run python manage.py collectstatic --noinput

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: deeplrn:ci
