{% extends "common/base.html" %}
{% load ui_tags %}

{% block content %}
<header class="page-head"><h1>Password saved</h1></header>
<div class="card confirm-card">
  {% icon "check" %}
  <p class="confirm-message">Your password has been changed. You can now sign in with the new password.</p>
  <a class="btn btn-primary" href="{% url 'accounts:login' %}">Sign in</a>
</div>
{% endblock %}
