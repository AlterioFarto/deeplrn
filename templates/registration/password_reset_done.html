{% extends "common/base.html" %}
{% load ui_tags %}

{% block content %}
<header class="page-head"><h1>Check your inbox</h1></header>
<div class="card confirm-card">
  {% icon "check" %}
  <p class="confirm-message">If an account exists for that email, a password reset link has been sent.</p>
  <a class="btn btn-primary" href="{% url 'accounts:login' %}">Back to sign in</a>
</div>
{% endblock %}
