{% extends "common/base.html" %}
{% load ui_tags %}

{% block content %}
<header class="page-head"><h1>Reset your password</h1></header>
<div class="card form-card">
  <p class="muted">Enter your account email and we will send you a reset link.</p>
  <form method="post">
    {% csrf_token %}
    {% for field in form.visible_fields %}{% form_field field %}{% endfor %}
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Send reset link</button>
      <a class="btn btn-ghost" href="{% url 'accounts:login' %}">Back to sign in</a>
    </div>
  </form>
</div>
{% endblock %}
