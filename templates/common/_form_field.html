<div class="field{% if invalid %} field-invalid{% endif %}">
  {% if is_checkbox %}
    <label class="field-check">
      {{ field }}
      <span>{{ field.label }}</span>
      {% if field.help_text %}<small class="help">{{ field.help_text }}</small>{% endif %}
    </label>
  {% else %}
    <label class="field-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if not is_checkbox and field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<ul class="field-errors">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
